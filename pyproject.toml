[project]
name = "llm-question-scorer"
version = "0.1.0"
description = "LLM-based discovery of question features predictive of learning"
requires-python = ">=3.12"
dependencies = [
    "leapfit",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
leapfit = { git = "https://github.com/weiyumou/LeapFit.git", tag = "v0.9.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qscorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
